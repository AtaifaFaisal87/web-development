<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID</title>
</head>

<body>

    <!-- ID: identifies one specific element -->
    <h1 id="main-title">My Website</h1>

    <!--
        CLASS: groups elements together.
        All three divs belong to the "card" class.
    -->

    <div class="card">
        <h2>About Me</h2>
        <p>I am learning web development.</p>
    </div>

    <div class="card">
        <h2>My Skills</h2>
        <p>C++, HTML, MySQL</p>
    </div>

    <div class="card">
        <h2>My Projects</h2>
        <p>Revolif, LMS, Fruit Catcher</p>
    </div>

</body>
</html>
