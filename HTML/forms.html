<!doctype html>
<html lang="en">
  <head>
    <!-- Tells the browser how to interpret characters -->
    <meta charset="UTF-8" />

    <!-- Makes the page work properly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Text shown on the browser tab -->
    <title>HTML Forms</title>
  </head>

  <body>
    <h1>Scholarship Application</h1>

    <!--
        <form> contains all the fields
        that the user can fill in.
    -->
    <form>
      <!-- Text input -->
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required />

      <br /><br />

      <!-- Email input -->
      <!-- type="email" provides basic email validation -->
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <br /><br />

      <!-- Password input -->
      <!-- Characters typed here are hidden -->
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      />

      <br /><br />

      <!-- Number input -->
      <label for="age">Age:</label>
      <input type="number" id="age" placeholder="Enter your age" />

      <br /><br />

      <!-- Date input -->
      <!-- Browser provides a date picker -->
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" />

      <br /><br />

      <!--
            Textarea creates a larger text box.
            Useful for descriptions, statements, etc.
        -->
      <label for="about">Tell us about yourself:</label>
      <br />

      <textarea
        id="about"
        rows="5"
        cols="40"
        placeholder="Write something about yourself"
      ></textarea>

      <br /><br />

      <!--
            <select> creates a dropdown menu.
            <option> represents each choice.
        -->
      <label for="program">Select your program:</label>

      <select id="program">
        <!-- Default option -->
        <option value="">Choose a program</option>

        <option value="cis">Computer & Information Systems Engineering</option>

        <option value="ce">Computer Engineering</option>

        <option value="ee">Electrical Engineering</option>
      </select>

      <br /><br />

      <!--
            Radio buttons are used when the user
            should select ONE option.
        -->
      <label>Gender:</label>

      <input type="radio" id="male" name="gender" value="male" />
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">Female</label>

      <br /><br />

      <!--
            Checkboxes allow the user
            to select MULTIPLE options.
        -->
      <label>Skills:</label>

      <input type="checkbox" id="html" name="skills" value="html" />
      <label for="html">HTML</label>

      <input type="checkbox" id="cpp" name="skills" value="cpp" />
      <label for="cpp">C++</label>

      <input type="checkbox" id="sql" name="skills" value="sql" />
      <label for="sql">SQL</label>

      <br /><br />

      <!--
            Submit button.
            Clicking this attempts to submit the form.
        -->
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
