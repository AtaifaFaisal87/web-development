<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>

<body>

    <h1>Scholarships</h1>

    <!-- <table> creates the table -->
    <table>

        <!-- Table heading row -->
        <tr>
            <th>Scholarship</th>
            <th>Amount</th>
            <th>Deadline</th>
        </tr>

        <!-- First data row -->
        <tr>
            <td>HEC Scholarship</td>
            <td>100,000 PKR</td>
            <td>30 September</td>
        </tr>

        <!-- Second data row -->
        <tr>
            <td>NED Scholarship</td>
            <td>50,000 PKR</td>
            <td>15 October</td>
        </tr>

        <!-- Third data row -->
        <tr>
            <td>Merit Scholarship</td>
            <td>75,000 PKR</td>
            <td>20 October</td>
        </tr>

    </table>

</body>
</html>
