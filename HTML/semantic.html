<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
</head>

<body>

    <!-- Header: top part of the webpage -->
    <header>
        <h1>My Website</h1>
    </header>

    <!-- Nav: navigation links -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main: main content of the webpage -->
    <main>

        <!-- Section: a specific section of content -->
        <section>
            <h2>About Me</h2>
            <p>I am a student learning web development.</p>
        </section>

        <!-- Another section -->
        <section>
            <h2>My Skills</h2>

            <ul>
                <li>C++</li>
                <li>HTML</li>
                <li>MySQL</li>
            </ul>
        </section>

        <!-- Another section -->
        <section>
            <h2>My Projects</h2>

            <p>Rebolif</p>
            <p>Learning Management System</p>
        </section>

    </main>

    <!-- Footer: bottom part of the webpage -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
